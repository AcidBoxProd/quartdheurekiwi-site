<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100c08">
<title>Quart d'Heure Kiwi Run</title>
<link rel="icon" href="img/qhk-logo.png">
<link rel="stylesheet" href="fonts/pixel.css?v=2026100604">
<link rel="stylesheet" href="style.css?v=2026100604">
<script defer src="engine.js?v=2026100604"></script>
<script defer src="renderer.js?v=2026100604"></script>
<script defer src="script.js?v=2026100604"></script>
</head>
<body>
<main id="stage" aria-label="Quart d’Heure Kiwi Run">
<canvas id="scene" width="800" height="450" aria-label="Terrain de jeu"></canvas>
<section id="splash" class="screen" aria-label="Bienvenue">
<button id="play" class="solid start">PLAY !</button>
</section>
<section id="home" class="screen" hidden aria-label="Accueil">
<button id="start" class="image-button" aria-label="Start Game"></button>
<button id="settings-open" class="image-button" aria-label="Open Menu"></button>
</section>
<section id="settings" class="screen" hidden aria-label="Réglages">
<button id="settings-back" class="image-button back" aria-label="Retour à l’accueil"></button>
<button id="music-toggle" class="image-button" aria-label="Musique" aria-pressed="true"></button>
<button id="sfx-toggle" class="image-button" aria-label="Effets sonores" aria-pressed="true"></button>
</section>
<section id="characters" class="screen" hidden aria-label="Choisir un personnage">
<button id="characters-back" class="image-button back" aria-label="Retour à l’accueil"></button>
<p class="record">High Score: <span id="record">0</span></p>
<button class="image-button character" data-character="raphael" aria-label="Select Raphaël"></button>
<button class="image-button character" data-character="mick" aria-label="Select Mick"></button>
<button class="image-button character" data-character="thibault" aria-label="Select Thibault"></button>
<button class="image-button character" data-character="simon" aria-label="Select Simon"></button>
</section>
<section id="game" class="screen" hidden aria-label="Partie">
<div id="score">SCORE: 0</div><div id="hearts" aria-label="3 vies"></div>
<button id="pause" class="small" aria-label="Pause"><span class="pause-bars" aria-hidden="true"></span></button>
<button id="boost" aria-label="Activer le boost" disabled><span id="boost-fill"></span><span id="boost-label">BOOST</span></button>
<div id="pause-panel" class="overlay" hidden><h1 id="pause-title">PAUSED</h1><div id="pause-actions"><button id="pause-home" class="solid">Home</button><button id="resume" class="solid">Resume</button></div><p id="countdown" hidden></p></div>
<div id="over" class="overlay" hidden><h1>Game Over!</h1><p>Final Score: <span id="final-score">0</span></p><p>High Score: <span id="final-record">0</span></p><div><button id="restart" class="solid">Restart Run</button><button id="change-character" class="solid">Change Character</button></div></div>
</section>
<div id="confirmation" class="overlay" hidden><h1>Quitter la partie ?</h1><p>La partie en cours sera perdue.</p><div><button id="confirm-home" class="solid">Quitter</button><button id="cancel-home" class="solid">Continuer</button></div></div>
<div id="loading" class="overlay"><p id="loading-text" role="status">Chargement…</p><button id="retry" class="solid" hidden>Réessayer</button></div>
<div id="context-error" class="overlay" hidden><p>L’affichage a été interrompu. La partie est en pause.</p><button id="context-retry" class="solid">Recharger le jeu</button></div>
</main>
<p id="portrait-hint">Tournez votre appareil pour jouer en grand format.</p>
<noscript>Activez JavaScript pour jouer à QHK Run.</noscript>
</body></html>
